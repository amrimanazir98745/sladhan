<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A2A35" />
      <stop offset="50%" stop-color="#0E4A5C" />
      <stop offset="100%" stop-color="#0A3040" />
    </linearGradient>
    <linearGradient id="archGrad" x1="256" y1="100" x2="256" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#CCEFFF" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="106" stroke="rgba(255,255,255,0.08)" stroke-width="3" fill="none" />

  <!-- Mosque arch icon (centered, white) -->
  <!-- Base platform -->
  <rect x="108" y="390" width="296" height="28" rx="10" fill="url(#archGrad)" opacity="0.95"/>

  <!-- Left minaret -->
  <rect x="120" y="230" width="48" height="165" rx="10" fill="url(#archGrad)" opacity="0.95"/>
  <!-- Left minaret top -->
  <ellipse cx="144" cy="228" rx="26" ry="14" fill="url(#archGrad)" opacity="0.95"/>
  <path d="M133 228 Q144 195 155 228" fill="url(#archGrad)" opacity="0.95"/>

  <!-- Right minaret -->
  <rect x="344" y="230" width="48" height="165" rx="10" fill="url(#archGrad)" opacity="0.95"/>
  <!-- Right minaret top -->
  <ellipse cx="368" cy="228" rx="26" ry="14" fill="url(#archGrad)" opacity="0.95"/>
  <path d="M357 228 Q368 195 379 228" fill="url(#archGrad)" opacity="0.95"/>

  <!-- Main dome body -->
  <rect x="175" y="280" width="162" height="115" rx="6" fill="url(#archGrad)" opacity="0.95"/>

  <!-- Main dome arch -->
  <path d="M175 295 Q175 145 256 130 Q337 145 337 295 Z" fill="url(#archGrad)" opacity="0.95"/>

  <!-- Door cutout (negative) -->
  <path d="M224 395 L224 320 Q224 290 256 285 Q288 290 288 320 L288 395 Z" fill="url(#bgGrad)" opacity="0.85"/>

  <!-- Crescent on top -->
  <path d="M256 118 Q270 108 270 118 Q270 134 256 138 Q264 130 264 118 Q264 110 256 118Z" fill="white" opacity="0.9"/>
</svg>
